<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumi · Anamnese</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,Arial;color:#e9f0fb;background:#08111e;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#142642,#08111e 60%);min-height:100vh}.shell{max-width:980px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #26364e;padding:10px 0 18px}.brand{font-size:26px;font-weight:800;letter-spacing:-1px;color:#a7d2ff}.brand small{display:block;font-size:11px;letter-spacing:1.5px;color:#93a7c0;font-weight:600}.top button,.btn{border:1px solid #31435f;background:#18283e;color:#ebf3ff;padding:11px 15px;border-radius:12px;cursor:pointer}.nav{display:flex;gap:8px;margin:20px 0}.nav button{border:0;background:transparent;color:#a9bad0;padding:10px;cursor:pointer}.nav button.on{color:#a7d2ff;border-bottom:2px solid #69aaf4}.panel{background:#101c2d;border:1px solid #26364e;border-radius:20px;padding:24px;box-shadow:0 20px 50px #0003}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.muted{color:#a9bad0;line-height:1.6}.badge{display:inline-block;border-radius:99px;padding:5px 10px;background:#26364e;color:#a7d2ff;font-size:12px}.warn{background:#4b281f;color:#ffd5be;padding:12px;border-radius:12px;margin:14px 0}.chat{height:390px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:12px 0}.msg{max-width:82%;padding:12px 15px;border-radius:16px;background:#1a2b42;line-height:1.5;white-space:pre-wrap}.msg.user{align-self:flex-end;background:#225c98}.compose{display:flex;gap:10px}.compose input,input,textarea{background:#0b1523;border:1px solid #334760;color:#eef5ff;border-radius:12px;padding:13px;width:100%}.compose .btn{background:#397ec5;border:0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{border:1px solid #2b3b51;border-radius:14px;padding:16px;margin:10px 0}.item h3{margin:0 0 7px}.item p{margin:4px 0}.form label{display:block;margin-top:14px;color:#a9bad0}.form textarea{min-height:76px;margin-top:7px}.primary{background:#397ec5;border:0}.empty{border:1px dashed #354962;border-radius:14px;padding:28px;text-align:center;color:#a9bad0}.hidden{display:none}@media(max-width:650px){.shell{padding:12px}.grid{grid-template-columns:1fr}.panel{padding:17px}.chat{height:50vh}.top{align-items:flex-start}.nav{justify-content:space-between}.nav button{font-size:12px;padding:8px 3px}.compose{flex-wrap:wrap}}
  </style>
</head>
<body><div class="shell">
  <header class="top"><div class="brand">◕ lumi <small>O CUIDADO COMEÇA ANTES</small></div><span id="mode" class="badge">Conectando…</span></header>
  <nav class="nav"><button id="tab-patient" class="on" onclick="show('patient')">Paciente</button><button id="tab-doctor" onclick="show('doctor')">Painel profissional</button></nav>
  <main id="view"></main>
</div>
<script>
const view=document.getElementById('view'),API='';let sessionId=sessionStorage.getItem('anamnesisSession'),chat=[],busy=false,report=null;
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function req(path,opts={}){const r=await fetch(API+path,opts);const data=await r.json().catch(()=>({detail:'Resposta inválida da API'}));if(!r.ok)throw Error(data.detail||'Falha na API');return data}
async function init(){try{const x=await req('/api/health');document.getElementById('mode').textContent=x.provider==='groq'?'IA conectada · Groq':'Demonstração local · IA não configurada';}catch{document.getElementById('mode').textContent='API indisponível';}patientHome()}
function show(which){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.id==='tab-'+which));which==='patient'?patientHome():doctorHome()}
function patientHome(){view.innerHTML=`<section class="panel"><span class="badge">PRÉ-ATENDIMENTO</span><h1>Vamos organizar seu relato de saúde.</h1><p class="muted">Conte com suas palavras. As informações serão encaminhadas para revisão de um profissional. Use apenas dados fictícios nesta demonstração.</p><div class="warn">Se você estiver em uma emergência, procure atendimento agora ou ligue 192.</div><label>Nome demonstrativo<input id="patient-name" value="Paciente demonstrativo" maxlength="120"></label><button class="btn primary" onclick="start()">Iniciar conversa</button>${sessionId?` <button class="btn" onclick="resume()">Retomar sessão</button>`:''}</section>`}
async function start(){try{const name=document.getElementById('patient-name').value||'Paciente demonstrativo';const s=await req('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_name:name,demo:true})});sessionId=s.id;sessionStorage.setItem('anamnesisSession',sessionId);sessionStorage.setItem('sessionToken',s.session_token);chat=s.messages;conversation()}catch(e){alert(e.message)}}
async function resume(){try{const s=await req('/api/sessions/'+sessionId,{headers:{'X-Session-Token':sessionStorage.getItem('sessionToken')||''}});chat=s.messages;conversation()}catch(e){alert(e.message)}}
function conversation(){document.getElementById('tab-patient').classList.add('on');document.getElementById('tab-doctor').classList.remove('on');view.innerHTML=`<section class="panel"><div class="row"><div><span class="badge">SESSÃO ${h(sessionId.slice(0,8))}</span><h2>Conversa de pré-atendimento</h2></div><button class="btn" onclick="finalize()">Concluir</button></div><div class="warn">${document.getElementById('mode').textContent.includes('Demonstração')?'Modo demonstrativo por regras. As respostas não são geradas por IA.':'A IA coleta informações e não substitui avaliação profissional.'}</div><div id="chat" class="chat">${chat.map(m=>`<div class="msg ${m.role==='user'?'user':''}">${h(m.content)}</div>`).join('')}</div><div class="compose"><input id="message" placeholder="Escreva sua resposta…" maxlength="5000" onkeydown="if(event.key==='Enter')send()"><button id="send" class="btn primary" onclick="send()">Enviar</button></div><label class="muted">Ou enviar áudio (até 15 MB) <input id="audio-file" type="file" accept="audio/webm,audio/wav,audio/mpeg,audio/mp4,audio/ogg" onchange="uploadAudio()"></label><p class="muted">Uma pergunta por vez. Você pode informar que não sabe.</p></section>`;scrollChat()}
function scrollChat(){const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight}
async function send(){if(busy)return;const input=document.getElementById('message'),text=input.value.trim();if(!text)return;busy=true;const button=document.getElementById('send');button.disabled=true;input.disabled=true;try{const s=await req(`/api/sessions/${sessionId}/messages`,{method:'POST',headers:{'Content-Type':'application/json','X-Session-Token':sessionStorage.getItem('sessionToken')||''},body:JSON.stringify({content:text})});chat=s.messages;conversation();if(s.status==='urgent')alert('Procure atendimento imediato ou ligue 192.');}catch(e){alert(e.message)}finally{busy=false}}
async function uploadAudio(){const input=document.getElementById('audio-file'),file=input.files[0];if(!file)return;const form=new FormData();form.append('file',file);input.disabled=true;try{const s=await req(`/api/sessions/${sessionId}/audio`,{method:'POST',headers:{'X-Session-Token':sessionStorage.getItem('sessionToken')||''},body:form});chat=s.messages;conversation()}catch(e){alert(e.message);input.disabled=false}}
async function finalize(){try{report=await req(`/api/sessions/${sessionId}/finalize`,{method:'POST',headers:{'X-Session-Token':sessionStorage.getItem('sessionToken')||''}});showReport()}catch(e){alert(e.message)}}
function showReport(){document.getElementById('tab-patient').classList.add('on');document.getElementById('tab-doctor').classList.remove('on');const c=report.content;view.innerHTML=`<section class="panel"><span class="badge">RELATÓRIO · ${h(report.status)}</span><h1>Entrevista concluída</h1><p class="muted">Relatório preliminar aguardando revisão profissional.</p>${reportCard(c)}<button class="btn primary" onclick="patientHome()">Nova sessão</button></section>`}
function reportCard(c){return `<div class="grid">${[['Queixa principal',c.queixa_principal],['Tempo de evolução',c.tempo_evolucao],['Subjetivo',c.soap.subjetivo],['Objetivo',c.soap.objetivo],['Avaliação preliminar',c.soap.avaliacao],['Plano de segurança',c.soap.plano],['Histórico',JSON.stringify(c.historico)],['Alertas',c.alertas_red_flags.join('; ')||'Nenhum alerta identificado nesta entrevista'],['Sugestões CID',c.sugestoes_cid.join('; ')||'Não sugeridas']].map(([k,v])=>`<article class="item"><strong>${h(k)}</strong><p class="muted">${h(v||'Não informado')}</p></article>`).join('')}</div>`}
async function doctorHome(){document.getElementById('tab-patient').classList.remove('on');document.getElementById('tab-doctor').classList.add('on');view.innerHTML=`<section class="panel"><span class="badge">ÁREA PROFISSIONAL</span><h1>Relatórios para revisão</h1><p class="muted">Autenticação por token da API. A configuração demonstrativa padrão é local-demo-token-change-me; substitua em ambientes compartilhados.</p><div class="compose"><input id="token" placeholder="Token profissional" value="${h(sessionStorage.getItem('clinicianToken')||'')}"><button class="btn primary" onclick="loadReports()">Acessar</button></div><div id="reports" class="empty">Informe o token para carregar os relatórios.</div></section>`}
async function loadReports(){const token=document.getElementById('token').value;sessionStorage.setItem('clinicianToken',token);try{const rs=await req('/api/reports',{headers:{'X-Clinician-Token':token}});document.getElementById('reports').className='';document.getElementById('reports').innerHTML=rs.length?rs.map(r=>`<article class="item"><div class="row"><div><h3>${h(r.patient_name)} ${r.is_demo?'<span class="badge">DEMO</span>':''}</h3><p class="muted">${h(r.status)} · ${new Date(r.created_at).toLocaleString('pt-BR')}</p></div><button class="btn" onclick="review('${r.id}')">Revisar</button></div></article>`).join(''):'<div class="empty">Nenhum relatório disponível.</div>'}catch(e){alert(e.message)}}
async function review(id){const token=sessionStorage.getItem('clinicianToken');try{report=await req('/api/reports/'+id,{headers:{'X-Clinician-Token':token}});const c=report.content;view.innerHTML=`<section class="panel"><span class="badge">REVISÃO · ${h(report.status)}</span><h1>Revisar relatório SOAP</h1><p class="muted">Conversa relatada pelo paciente:</p><div class="chat">${report.messages.map(m=>`<div class="msg ${m.role==='user'?'user':''}"><strong>${m.role==='user'?'Paciente':'Lumi'}:</strong> ${h(m.content)}</div>`).join('')}</div><p class="muted">Síntese preliminar gerada a partir do relato. Revise os campos antes de aprovar.</p><div class="form" id="edit">${[['queixa_principal','Queixa principal',c.queixa_principal],['tempo_evolucao','Tempo de evolução',c.tempo_evolucao],['subjetivo','Subjetivo',c.soap.subjetivo],['objetivo','Objetivo',c.soap.objetivo],['avaliacao','Avaliação preliminar',c.soap.avaliacao],['plano','Plano',c.soap.plano]].map(([k,l,v])=>`<label>${l}<textarea id="f-${k}">${h(v)}</textarea></label>`).join('')}<label>Notas da revisão<textarea id="notes"></textarea></label></div>${c.alertas_red_flags.length?`<div class="warn">Alertas: ${h(c.alertas_red_flags.join('; '))}</div>`:''}<button class="btn primary" onclick="approve('${id}')">Salvar e aprovar</button> <button class="btn" onclick="doctorHome();setTimeout(loadReports,0)">Voltar</button></section>`}catch(e){alert(e.message)}}
async function approve(id){const token=sessionStorage.getItem('clinicianToken');const content=report.content;for(const k of ['queixa_principal','tempo_evolucao'])content[k]=document.getElementById('f-'+k).value;for(const k of ['subjetivo','objetivo','avaliacao','plano'])content.soap[k]=document.getElementById('f-'+k).value;try{report=await req(`/api/reports/${id}/review`,{method:'PATCH',headers:{'Content-Type':'application/json','X-Clinician-Token':token},body:JSON.stringify({reviewer:'Profissional demonstrativo',notes:document.getElementById('notes').value,approved:true,edited_content:content})});alert('Relatório revisado e aprovado.');doctorHome();setTimeout(loadReports,0)}catch(e){alert(e.message)}}
init();
</script></body></html>
